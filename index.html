<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>90s 레트로 테트리스 게임</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* 배경 이미지 적용 (tet01.png) */
            background: url('tet01.png') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            display: flex;
            gap: 20px;
            background-color: rgba(20, 20, 30, 0.88);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.3), 0 10px 40px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #tetris {
            border: 2px solid #00ffcc;
            background-color: rgba(0, 0, 0, 0.85);
            border-radius: 6px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 160px;
        }

        .info-box {
            background-color: rgba(45, 45, 60, 0.8);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .info-box h2 {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .info-box p {
            font-size: 1.6rem;
            font-weight: bold;
            color: #00ffcc;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.6);
        }

        .btn {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            font-weight: bold;
            color: #000;
            background-color: #00ffcc;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
            margin-bottom: 8px;
        }

        .btn:hover {
            background-color: #ff0d72;
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 13, 114, 0.7);
        }

        .btn-secondary {
            background-color: #ff8e0d;
        }

        .controls-info {
            background-color: rgba(45, 45, 60, 0.8);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            line-height: 1.5;
            color: #ddd;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .controls-info h3 {
            color: #ff0d72;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- 테트리스 게임판 (가로 12칸 x 세로 20칸) -->
        <canvas id="tetris" width="240" height="400"></canvas>

        <div class="side-panel">
            <div>
                <div class="info-box">
                    <h2>점수 (SCORE)</h2>
                    <p id="score">0</p>
                </div>
                <div class="info-box">
                    <h2>레벨 (LEVEL)</h2>
                    <p id="level">1</p>
                </div>
                <button class="btn" id="start-btn" onclick="startGame()">게임 시작</button>
                <button class="btn btn-secondary" id="sound-btn" onclick="toggleSound()">BGM: ON</button>
            </div>

            <div class="controls-info">
                <h3>조작 방법</h3>
                <p>◀ / ▶ : 좌우 이동</p>
                <p>▲ : 회전</p>
                <p>▼ : 소프트 드롭</p>
                <p>스페이스바 : 하드 드롭</p>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const levelElement = document.getElementById('level');
        const soundBtn = document.getElementById('sound-btn');

        context.scale(20, 20);

        // --- 레트로 사운드 (Web Audio API) 시스템 ---
        let audioCtx = null;
        let isMuted = false;
        let bgmTimer = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // 8-bit 스타일 톤 재생 (효과음용)
        function playTone(freq, type = 'square', duration = 0.1, vol = 0.1) {
            if (isMuted || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        // 줄 지워질 때 신나는 레트로 사운드
        function playClearSound() {
            if (isMuted || !audioCtx) return;
            const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
            notes.forEach((freq, idx) => {
                setTimeout(() => playTone(freq, 'triangle', 0.15, 0.2), idx * 60);
            });
        }

        // 테트리스 대표 멜로디 음고 정의 (Korobeiniki 90s 스타일)
        const BGM_MELODY = [
            {n: 659, d: 400}, {n: 494, d: 200}, {n: 523, d: 200}, {n: 587, d: 400}, {n: 523, d: 200}, {n: 494, d: 200},
            {n: 440, d: 400}, {n: 440, d: 200}, {n: 523, d: 200}, {n: 659, d: 400}, {n: 587, d: 200}, {n: 523, d: 200},
            {n: 494, d: 600}, {n: 523, d: 200}, {n: 587, d: 400}, {n: 659, d: 400}, {n: 523, d: 400}, {n: 440, d: 400}, {n: 440, d: 600},
            {n: 587, d: 400}, {n: 698, d: 200}, {n: 880, d: 400}, {n: 784, d: 200}, {n: 698, d: 200}, {n: 659, d: 600}, {n: 523, d: 200},
            {n: 659, d: 400}, {n: 587, d: 200}, {n: 523, d: 200}, {n: 494, d: 400}, {n: 494, d: 200}, {n: 523, d: 200}, {n: 587, d: 400},
            {n: 659, d: 400}, {n: 523, d: 400}, {n: 440, d: 400}, {n: 440, d: 600}
        ];
        let bgmIndex = 0;

        function playBGMStep() {
            if (!isGameRunning || isMuted || !audioCtx) return;
            const note = BGM_MELODY[bgmIndex];
            playTone(note.n, 'sawtooth', note.d / 1000, 0.05); // 레트로 신스 톱니파 사용
            
            bgmIndex = (bgmIndex + 1) % BGM_MELODY.length;
            bgmTimer = setTimeout(playBGMStep, note.d);
        }

        function startBGM() {
            stopBGM();
            bgmIndex = 0;
            playBGMStep();
        }

        function stopBGM() {
            if (bgmTimer) clearTimeout(bgmTimer);
        }

        function toggleSound() {
            isMuted = !isMuted;
            soundBtn.innerText = isMuted ? "BGM: OFF" : "BGM: ON";
            if (!isMuted && isGameRunning) {
                initAudio();
                startBGM();
            } else {
                stopBGM();
            }
        }

        // --- 테트리스 게임 로직 ---
        const COLORS = [
            null,
            '#FF0D72', '#0DC2FF', '#0DFF72',
            '#F538FF', '#FF8E0D', '#FFE138', '#3877FF'
        ];

        function createPiece(type) {
            if (type === 'I') return [[0,1,0,0],[0,1,0,0],[0,1,0,0],[0,1,0,0]];
            if (type === 'L') return [[0,2,0],[0,2,0],[0,2,2]];
            if (type === 'J') return [[0,3,0],[0,3,0],[3,3,0]];
            if (type === 'O') return [[4,4],[4,4]];
            if (type === 'Z') return [[5,5,0],[0,5,5],[0,0,0]];
            if (type === 'S') return [[0,6,6],[6,6,0],[0,0,0]];
            if (type === 'T') return [[0,7,0],[7,7,7],[0,0,0]];
        }

        function createMatrix(w, h) {
            const matrix = [];
            while (h--) matrix.push(new Array(w).fill(0));
            return matrix;
        }

        const arena = createMatrix(12, 20);

        const player = {
            pos: {x: 0, y: 0},
            matrix: null,
            score: 0,
            level: 1,
            lines: 0
        };

        function collide(arena, player) {
            const [m, o] = [player.matrix, player.pos];
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        arena[y + player.pos.y][x + player.pos.x] = value;
                    }
                });
            });
        }

        // 🌟 [핵심] 완성된 줄을 삭제하고 위쪽 줄을 당겨와 공간을 만들어주는 로직
        function arenaSweep() {
            let rowCount = 1;
            let cleared = false;
            
            // 아래 줄부터 위로 검사
            outer: for (let y = arena.length - 1; y >= 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) {
                        continue outer; // 0이 하나라도 있으면 안 지워짐
                    }
                }

                // 한 줄이 모두 차면 해당 행(row)을 삭제 
                const row = arena.splice(y, 1)[0].fill(0);
                // 삭제된 행의 빈 공간을 맨 위에 삽입하여 위쪽 블록 전체를 한 칸씩 아래로 내림
                arena.unshift(row);
                
                // 삭제한 위치부터 다시 재검사
                ++y;

                player.score += rowCount * 10;
                player.lines++;
                rowCount *= 2;
                cleared = true;

                if (player.lines >= player.level * 10) {
                    player.level++;
                    dropInterval = Math.max(100, 1000 - (player.level - 1) * 100);
                }
            }

            if (cleared) {
                playClearSound(); // 완성 사운드 재생
            }
            updateScore();
        }

        function draw() {
            context.fillStyle = 'rgba(0, 0, 0, 0.85)';
            context.fillRect(0, 0, canvas.width, canvas.height);

            drawMatrix(arena, {x: 0, y: 0});
            drawMatrix(player.matrix, player.pos);
        }

        function drawMatrix(matrix, offset) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        context.fillStyle = COLORS[value];
                        context.fillRect(x + offset.x, y + offset.y, 1, 1);
                        context.lineWidth = 0.05;
                        context.strokeStyle = '#ffffff';
                        context.strokeRect(x + offset.x, y + offset.y, 1, 1);
                    }
                });
            });
        }

        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playTone(150, 'square', 0.05, 0.05); // 착지음
                playerReset();
                arenaSweep();
            }
            dropCounter = 0;
        }

        function playerHardDrop() {
            while (!collide(arena, player)) {
                player.pos.y++;
            }
            player.pos.y--;
            merge(arena, player);
            playTone(200, 'square', 0.08, 0.08); // 하드드롭 효과음
            playerReset();
            arenaSweep();
            dropCounter = 0;
        }

        function playerMove(dir) {
            player.pos.x += dir;
            if (collide(arena, player)) {
                player.pos.x -= dir;
            } else {
                playTone(300, 'sine', 0.03, 0.03); // 이동 효과음
            }
        }

        function playerReset() {
            const pieces = 'ILJOTSZ';
            player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

            if (collide(arena, player)) {
                stopBGM();
                playTone(100, 'sawtooth', 0.5, 0.3);
                alert("게임 오버! 최종 점수: " + player.score);
                arena.forEach(row => row.fill(0));
                player.score = 0;
                player.level = 1;
                player.lines = 0;
                dropInterval = 1000;
                updateScore();
            }
        }

        function playerRotate(dir) {
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -dir);
                    player.pos.x = pos;
                    return;
                }
            }
            playTone(400, 'triangle', 0.05, 0.05); // 회전 효과음
        }

        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            if (dir > 0) matrix.forEach(row => row.reverse());
            else matrix.reverse();
        }

        function updateScore() {
            scoreElement.innerText = player.score;
            levelElement.innerText = player.level;
        }

        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;
        let isGameRunning = false;

        function update(time = 0) {
            if (!isGameRunning) return;

            const deltaTime = time - lastTime;
            lastTime = time;

            dropCounter += deltaTime;
            if (dropCounter > dropInterval) {
                playerDrop();
            }

            draw();
            requestAnimationFrame(update);
        }

        function startGame() {
            initAudio();
            arena.forEach(row => row.fill(0));
            player.score = 0;
            player.level = 1;
            player.lines = 0;
            dropInterval = 1000;
            updateScore();
            playerReset();
            
            if (!isGameRunning) {
                isGameRunning = true;
                update();
            }

            if (!isMuted) {
                startBGM();
            }
        }

        document.addEventListener('keydown', event => {
            if (!isGameRunning) return;

            if (event.keyCode === 37) playerMove(-1);
            else if (event.keyCode === 39) playerMove(1);
            else if (event.keyCode === 40) playerDrop();
            else if (event.keyCode === 38) playerRotate(1);
            else if (event.keyCode === 32) {
                event.preventDefault();
                playerHardDrop();
            }
        });
    </script>
</body>
</html>
