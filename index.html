<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 테트리스 게임</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            display: flex;
            gap: 20px;
            background-color: #2a2a2a;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        #tetris {
            border: 2px solid #444;
            background-color: #000;
            border-radius: 4px;
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 150px;
        }

        .info-box {
            background-color: #333;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .info-box h2 {
            font-size: 1rem;
            color: #aaa;
            margin-bottom: 5px;
        }

        .info-box p {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00ffcc;
        }

        .controls-info {
            background-color: #333;
            padding: 15px;
            border-radius: 8px;
            font-size: 0.85rem;
            line-height: 1.5;
            color: #ccc;
        }

        .controls-info h3 {
            color: #fff;
            margin-bottom: 8px;
        }

        #start-btn {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
            background-color: #00ffcc;
            color: #000;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        #start-btn:hover {
            background-color: #00cca3;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- 테트리스 게임판 (가로 10칸, 세로 20칸 / 1칸=20px -> 200x400) -->
        <canvas id="tetris" width="240" height="400"></canvas>

        <div class="side-panel">
            <div>
                <div class="info-box">
                    <h2>점수 (SCORE)</h2>
                    <p id="score">0</p>
                </div>
                <div class="info-box">
                    <h2>레벨 (LEVEL)</h2>
                    <p id="level">1</p>
                </div>
                <button id="start-btn" onclick="startGame()">게임 시작</button>
            </div>

            <div class="controls-info">
                <h3>조작 방법</h3>
                <p>◀ / ▶ : 좌우 이동</p>
                <p>▲ : 회전</p>
                <p>▼ : 소프트 드롭</p>
                <p>스페이스바 : 하드 드롭</p>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const levelElement = document.getElementById('level');

        // 캔버스 크기 확대 스케일 설정 (1블록 = 20px)
        context.scale(20, 20);

        // 테트리스 블록 색상 정의
        const COLORS = [
            null,
            '#FF0D72', // I (분홍)
            '#0DC2FF', // J (시안)
            '#0DFF72', // L (라임)
            '#F538FF', // O (자주)
            '#FF8E0D', // S (주황)
            '#FFE138', // T (노랑)
            '#3877FF'  // Z (파랑)
        ];

        // 테트리스 블록 모양 생성
        function createPiece(type) {
            if (type === 'I') {
                return [
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                ];
            } else if (type === 'L') {
                return [
                    [0, 2, 0],
                    [0, 2, 0],
                    [0, 2, 2],
                ];
            } else if (type === 'J') {
                return [
                    [0, 3, 0],
                    [0, 3, 0],
                    [3, 3, 0],
                ];
            } else if (type === 'O') {
                return [
                    [4, 4],
                    [4, 4],
                ];
            } else if (type === 'Z') {
                return [
                    [5, 5, 0],
                    [0, 5, 5],
                    [0, 0, 0],
                ];
            } else if (type === 'S') {
                return [
                    [0, 6, 6],
                    [6, 6, 0],
                    [0, 0, 0],
                ];
            } else if (type === 'T') {
                return [
                    [0, 7, 0],
                    [7, 7, 7],
                    [0, 0, 0],
                ];
            }
        }

        // 게임 판(매트릭스) 생성 (12가로, 20세로)
        function createMatrix(w, h) {
            const matrix = [];
            while (h--) {
                matrix.push(new Array(w).fill(0));
            }
            return matrix;
        }

        const arena = createMatrix(12, 20);

        const player = {
            pos: {x: 0, y: 0},
            matrix: null,
            score: 0,
            level: 1,
            lines: 0
        };

        // 충돌 검사
        function collide(arena, player) {
            const [m, o] = [player.matrix, player.pos];
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 &&
                       (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        // 바닥에 도달했을 때 판에 고정
        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        arena[y + player.pos.y][x + player.pos.x] = value;
                    }
                });
            });
        }

        // 완성된 줄 삭제 및 점수 계산
        function arenaSweep() {
            let rowCount = 1;
            outer: for (let y = arena.length - 1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) {
                        continue outer;
                    }
                }
                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;

                player.score += rowCount * 10;
                player.lines++;
                rowCount *= 2;

                // 10줄 지울 때마다 레벨 업 & 속도 증가
                if (player.lines >= player.level * 10) {
                    player.level++;
                    dropInterval = Math.max(100, 1000 - (player.level - 1) * 100);
                }
            }
            updateScore();
        }

        // 그리기 함수
        function draw() {
            context.fillStyle = '#000';
            context.fillRect(0, 0, canvas.width, canvas.height);

            drawMatrix(arena, {x: 0, y: 0});
            drawMatrix(player.matrix, player.pos);
        }

        function drawMatrix(matrix, offset) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        context.fillStyle = COLORS[value];
                        context.fillRect(x + offset.x, y + offset.y, 1, 1);
                        
                        // 블록 테두리 효과
                        context.lineWidth = 0.05;
                        context.strokeStyle = '#ffffff';
                        context.strokeRect(x + offset.x, y + offset.y, 1, 1);
                    }
                });
            });
        }

        // 떨어지는 로직
        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
            }
            dropCounter = 0;
        }

        // 바로 떨어뜨리기 (하드 드롭)
        function playerHardDrop() {
            while (!collide(arena, player)) {
                player.pos.y++;
            }
            player.pos.y--;
            merge(arena, player);
            playerReset();
            arenaSweep();
            dropCounter = 0;
        }

        // 좌우 이동
        function playerMove(dir) {
            player.pos.x += dir;
            if (collide(arena, player)) {
                player.pos.x -= dir;
            }
        }

        // 새로운 블록 생성
        function playerReset() {
            const pieces = 'ILJOTSZ';
            player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

            // 게임 오버 조건
            if (collide(arena, player)) {
                alert("게임 오버! 최종 점수: " + player.score);
                arena.forEach(row => row.fill(0));
                player.score = 0;
                player.level = 1;
                player.lines = 0;
                dropInterval = 1000;
                updateScore();
            }
        }

        // 회전 로직
        function playerRotate(dir) {
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -dir);
                    player.pos.x = pos;
                    return;
                }
            }
        }

        // 행렬 회전 알고리즘
        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            if (dir > 0) {
                matrix.forEach(row => row.reverse());
            } else {
                matrix.reverse();
            }
        }

        // 점수 업데이트
        function updateScore() {
            scoreElement.innerText = player.score;
            levelElement.innerText = player.level;
        }

        let dropCounter = 0;
        let dropInterval = 1000; // 1초마다 하강
        let lastTime = 0;
        let isGameRunning = false;

        // 메인 게임 루프
        function update(time = 0) {
            if (!isGameRunning) return;

            const deltaTime = time - lastTime;
            lastTime = time;

            dropCounter += deltaTime;
            if (dropCounter > dropInterval) {
                playerDrop();
            }

            draw();
            requestAnimationFrame(update);
        }

        // 게임 시작
        function startGame() {
            arena.forEach(row => row.fill(0));
            player.score = 0;
            player.level = 1;
            player.lines = 0;
            dropInterval = 1000;
            updateScore();
            playerReset();
            
            if (!isGameRunning) {
                isGameRunning = true;
                update();
            }
        }

        // 키보드 조작 이벤트
        document.addEventListener('keydown', event => {
            if (!isGameRunning) return;

            if (event.keyCode === 37) { // 왼쪽 화살표
                playerMove(-1);
            } else if (event.keyCode === 39) { // 오른쪽 화살표
                playerMove(1);
            } else if (event.keyCode === 40) { // 아래쪽 화살표 (소프트 드롭)
                playerDrop();
            } else if (event.keyCode === 38) { // 위쪽 화살표 (회전)
                playerRotate(1);
            } else if (event.keyCode === 32) { // 스페이스바 (하드 드롭)
                event.preventDefault(); // 스크롤 방지
                playerHardDrop();
            }
        });
    </script>
</body>
</html>
