<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>쉬운 레트로 테트리스 게임</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* 배경 이미지 적용 (tet01.png) */
            background: url('tet01.png') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            display: flex;
            gap: 20px;
            background-color: rgba(20, 20, 30, 0.88);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.3), 0 10px 40px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #tetris {
            border: 2px solid #00ffcc;
            background-color: rgba(0, 0, 0, 0.85);
            border-radius: 6px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 170px;
        }

        .info-box {
            background-color: rgba(45, 45, 60, 0.8);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .info-box h2 {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .info-box p {
            font-size: 1.6rem;
            font-weight: bold;
            color: #00ffcc;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.6);
        }

        .btn {
            width: 100%;
            padding: 10px;
            font-size: 0.95rem;
            font-weight: bold;
            color: #000;
            background-color: #00ffcc;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
            margin-bottom: 8px;
        }

        .btn:hover:not(:disabled) {
            background-color: #ff0d72;
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 13, 114, 0.7);
        }

        /* 1회 한정 필살기 폭탄 리셋 버튼 스타일 */
        .btn-reset-board {
            background-color: #ff8e0d;
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 142, 13, 0.5);
        }

        .btn-reset-board:disabled {
            background-color: #555;
            color: #888;
            cursor: not-allowed;
            box-shadow: none;
        }

        .controls-info {
            background-color: rgba(45, 45, 60, 0.8);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            line-height: 1.5;
            color: #ddd;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .controls-info h3 {
            color: #ff0d72;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- 외부 배경음악 재생 태그 (게임 시작부터 종료 시까지 무한 반복) -->
    <audio id="bgm-player" src="bgm.wav" loop preload="auto"></audio>

    <div class="game-container">
        <!-- 테트리스 게임판 (가로 12칸 x 세로 20칸) -->
        <canvas id="tetris" width="240" height="400"></canvas>

        <div class="side-panel">
            <div>
                <div class="info-box">
                    <h2>점수 (SCORE)</h2>
                    <p id="score">0</p>
                </div>
                <div class="info-box">
                    <h2>레벨 (LEVEL)</h2>
                    <p id="level">1</p>
                </div>
                
                <button class="btn" id="start-btn" onclick="startGame()">게임 시작</button>
                <!-- 💣 딱 한번 쌓인 테트리스를 비워주는 찬스 버튼 -->
                <button class="btn btn-reset-board" id="bomb-btn" onclick="useBombReset()" disabled>💣 블록 청소 (1회)</button>
            </div>

            <div class="controls-info">
                <h3>조작 방법</h3>
                <p>◀ / ▶ : 좌우 이동</p>
                <p>▲ : 회전</p>
                <p>▼ : 천천히 내리기</p>
                <p>스페이스바 : 즉시 하강</p>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const levelElement = document.getElementById('level');
        const bombBtn = document.getElementById('bomb-btn');
        const bgmPlayer = document.getElementById('bgm-player');

        context.scale(20, 20);

        let bombAvailable = true; // 1회한정 찬스 여부

        const COLORS = [
            null,
            '#FF0D72', '#0DC2FF', '#0DFF72',
            '#F538FF', '#FF8E0D', '#FFE138', '#3877FF'
        ];

        function createPiece(type) {
            if (type === 'I') return [[0,1,0,0],[0,1,0,0],[0,1,0,0],[0,1,0,0]];
            if (type === 'L') return [[0,2,0],[0,2,0],[0,2,2]];
            if (type === 'J') return [[0,3,0],[0,3,0],[3,3,0]];
            if (type === 'O') return [[4,4],[4,4]];
            if (type === 'Z') return [[5,5,0],[0,5,5],[0,0,0]];
            if (type === 'S') return [[0,6,6],[6,6,0],[0,0,0]];
            if (type === 'T') return [[0,7,0],[7,7,7],[0,0,0]];
        }

        function createMatrix(w, h) {
            const matrix = [];
            while (h--) matrix.push(new Array(w).fill(0));
            return matrix;
        }

        const arena = createMatrix(12, 20);

        const player = {
            pos: {x: 0, y: 0},
            matrix: null,
            score: 0,
            level: 1,
            lines: 0
        };

        function collide(arena, player) {
            const [m, o] = [player.matrix, player.pos];
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        arena[y + player.pos.y][x + player.pos.x] = value;
                    }
                });
            });
        }

        // 완성된 줄 삭제 및 위쪽 줄 내려오기 로직
        function arenaSweep() {
            let rowCount = 1;
            outer: for (let y = arena.length - 1; y >= 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) continue outer;
                }

                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;

                player.score += rowCount * 10;
                player.lines++;
                rowCount *= 2;

                // 난이도를 너무 높이지 않도록 부드럽게 속도 증가
                if (player.lines >= player.level * 10) {
                    player.level++;
                    dropInterval = Math.max(300, 1800 - (player.level - 1) * 150);
                }
            }
            updateScore();
        }

        // 💣 1회 한정 찬스: 남아있는 테트리스 블록을 모두 지움
        function useBombReset() {
            if (!isGameRunning || !bombAvailable) return;

            arena.forEach(row => row.fill(0)); // 판 전체 비우기
            bombAvailable = false;
            bombBtn.disabled = true;
            bombBtn.innerText = "💣 찬스 사용완료";
        }

        // 그림자 위치 계산 (착지 위치 가이드라인)
        function getGhostPosition() {
            const ghost = {
                pos: { x: player.pos.x, y: player.pos.y },
                matrix: player.matrix
            };
            while (!collide(arena, ghost)) {
                ghost.pos.y++;
            }
            ghost.pos.y--;
            return ghost.pos;
        }

        function draw() {
            context.fillStyle = 'rgba(0, 0, 0, 0.85)';
            context.fillRect(0, 0, canvas.width, canvas.height);

            // 1. 고정된 보드 그리기에
            drawMatrix(arena, {x: 0, y: 0});

            // 2. 가이드 그림자 그리기 (쉬운 버전의 핵심!)
            if (player.matrix) {
                const ghostPos = getGhostPosition();
                drawMatrix(player.matrix, ghostPos, true);
            }

            // 3. 현재 떨어지는 블록 그리기
            if (player.matrix) {
                drawMatrix(player.matrix, player.pos);
            }
        }

        function drawMatrix(matrix, offset, isGhost = false) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        if (isGhost) {
                            // 그림자 블록은 반투명하고 점선 테두리로 표기
                            context.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                            context.lineWidth = 0.05;
                            context.strokeRect(x + offset.x, y + offset.y, 1, 1);
                        } else {
                            context.fillStyle = COLORS[value];
                            context.fillRect(x + offset.x, y + offset.y, 1, 1);
                            context.lineWidth = 0.05;
                            context.strokeStyle = '#ffffff';
                            context.strokeRect(x + offset.x, y + offset.y, 1, 1);
                        }
                    }
                });
            });
        }

        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
            }
            dropCounter = 0;
        }

        function playerHardDrop() {
            while (!collide(arena, player)) {
                player.pos.y++;
            }
            player.pos.y--;
            merge(arena, player);
            playerReset();
            arenaSweep();
            dropCounter = 0;
        }

        function playerMove(dir) {
            player.pos.x += dir;
            if (collide(arena, player)) {
                player.pos.x -= dir;
            }
        }

        function playerReset() {
            const pieces = 'ILJOTSZ';
            player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

            // 게임 오버 조건
            if (collide(arena, player)) {
                alert("게임 오버! 최종 점수: " + player.score);
                bgmPlayer.pause();
                arena.forEach(row => row.fill(0));
                player.score = 0;
                player.level = 1;
                player.lines = 0;
                dropInterval = 1800;
                isGameRunning = false;
                updateScore();
            }
        }

        function playerRotate(dir) {
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -dir);
                    player.pos.x = pos;
                    return;
                }
            }
        }

        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            if (dir > 0) matrix.forEach(row => row.reverse());
            else matrix.reverse();
        }

        function updateScore() {
            scoreElement.innerText = player.score;
            levelElement.innerText = player.level;
        }

        let dropCounter = 0;
        let dropInterval = 1800; // 🎯 쉬운 버전: 기본 1.8초마다 한칸 하강
        let lastTime = 0;
        let isGameRunning = false;

        function update(time = 0) {
            if (!isGameRunning) return;

            const deltaTime = time - lastTime;
            lastTime = time;

            dropCounter += deltaTime;
            if (dropCounter > dropInterval) {
                playerDrop();
            }

            draw();
            requestAnimationFrame(update);
        }

        function startGame() {
            arena.forEach(row => row.fill(0));
            player.score = 0;
            player.level = 1;
            player.lines = 0;
            dropInterval = 1800; // 넉넉한 1.8초 낙하 속도

            // 폭탄 버튼 초기화
            bombAvailable = true;
            bombBtn.disabled = false;
            bombBtn.innerText = "💣 블록 청소 (1회)";

            updateScore();
            playerReset();
            
            // 배경음악 무한 루프 재생
            bgmPlayer.currentTime = 0;
            bgmPlayer.play().catch(() => {});

            if (!isGameRunning) {
                isGameRunning = true;
                update();
            }
        }

        document.addEventListener('keydown', event => {
            if (!isGameRunning) return;

            if (event.keyCode === 37) playerMove(-1);
            else if (event.keyCode === 39) playerMove(1);
            else if (event.keyCode === 40) playerDrop();
            else if (event.keyCode === 38) playerRotate(1);
            else if (event.keyCode === 32) {
                event.preventDefault();
                playerHardDrop();
            }
        });
    </script>
</body>
</html>
